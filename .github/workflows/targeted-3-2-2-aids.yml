name: Targeted 3.2.2 source-led aids and Arabic emphasis
on:
  push:
    branches:
      - editorial/3-2-2-study-aid-roles-and-arabic-emphasis-20261129
permissions:
  contents: write
jobs:
  chapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Canonical build and generated-file check
        run: |
          python src/build.py
          python src/build.py --check
      - name: Focused source, study-aid, archive, Companion and adjacent-content tests
        run: |
          python src/tests/verify_amiri_3_2_2_source_led_aids.py
          python src/tests/verify_amiri_3_2_2_roles_and_emphasis.py
          python src/tests/verify_hikam_3_2_1_through_3_2_6.py
          python src/tests/verify_reading_companions.py
          python src/tests/verify_publication.py
          python src/tests/validate_structure.py
      - name: Fonts for real Arabic RTL and A4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-hosny-amiri fonts-noto-core
          fc-cache -f
          fc-match Amiri
          fc-match 'Noto Sans Arabic'
      - name: Scoped browser and PDF dependencies
        run: |
          python -m pip install playwright==1.57.0 pypdf==5.9.0
          python -m playwright install chromium
      - name: Mobile, desktop, contextual Source Depth and actual A4
        run: |
          python src/tests/browser_amiri_3_2_2_aids.py
      - name: Preserve focused print and mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter-322-source-aids-rtl-a4
          path: |
            index.html
            src/philosophy_study_notes.html
            service-worker.js
            test-artifacts/
          retention-days: 7
      - name: Commit generated reader only after successful targeted checks
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/philosophy_study_notes.html service-worker.js
          if ! git diff --cached --quiet; then
            git commit -m "Build verified 3.2.2 study-aid roles and prose emphasis [skip ci]"
            git push origin HEAD:refs/heads/editorial/3-2-2-study-aid-roles-and-arabic-emphasis-20261129
          fi
          python src/build.py --check
