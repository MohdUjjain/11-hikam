name: Targeted 3.2.3 roles and 3.2.4–3.2.5 prose emphasis
on:
  push:
    branches:
      - editorial/3-2-3-aid-roles-and-3-2-4-5-prose-emphasis-20261128
permissions:
  contents: write
jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and check exact generated outputs
        run: |
          python src/build.py
          python src/build.py --check
      - name: Targeted source, role, bold and anchor verification
        run: |
          python src/tests/verify_amiri_3_2_3_source_led_aids.py
          python src/tests/verify_ujairi_3_2_4_source_led_aids.py
          python src/tests/verify_azmi_3_2_5_source_led_aids.py
          python src/tests/verify_scoped_emphasis_3_2_3_through_3_2_5.py
          python src/tests/verify_hikam_3_2_1_through_3_2_6.py
          python src/tests/verify_reading_companions.py
          python src/tests/verify_publication.py
          python src/tests/validate_structure.py
      - name: Install Arabic fonts for actual print proof
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-hosny-amiri fonts-noto-core
          fc-cache -f
          fc-match Amiri
          fc-match 'Noto Sans Arabic'
      - name: Chromium and A4 dependencies
        run: |
          python -m pip install playwright==1.57.0 pypdf==5.9.0
          python -m playwright install chromium
      - name: Three scoped RTL/browser/PDF regressions
        run: |
          python src/tests/browser_amiri_3_2_3_aids.py
          python src/tests/browser_ujairi_3_2_4_aids.py
          python src/tests/browser_azmi_3_2_5_aids.py
      - name: Preserve evidence from this targeted run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-chapter-scoped-aids-emphasis
          path: |
            index.html
            src/philosophy_study_notes.html
            service-worker.js
            test-artifacts/
          retention-days: 7
      - name: Commit generated edition only after successful checks
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/philosophy_study_notes.html service-worker.js
          if ! git diff --cached --quiet; then
            git commit -m "Build verified 3.2.3 roles and 3.2.4–3.2.5 prose emphasis [skip ci]"
            git push origin HEAD:refs/heads/editorial/3-2-3-aid-roles-and-3-2-4-5-prose-emphasis-20261128
          fi
          python src/build.py --check
