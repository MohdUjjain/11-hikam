name: Targeted 3.2.4 refinement and 3.2.5 adjacent-duplication verification
on:
  push:
    branches:
      - editorial/3-2-4-refinement-3-2-5-dedup-20261128
permissions:
  contents: write
jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild and verify publication
        run: |
          python src/build.py
          python src/build.py --check
      - name: Focused integrity and two-chapter contract
        run: |
          python src/tests/verify_ujairi_3_2_4_source_led_aids.py
          python src/tests/verify_azmi_3_2_5_source_led_aids.py
          python src/tests/verify_hikam_3_2_1_through_3_2_6.py
          python src/tests/verify_reading_companions.py
          python src/tests/verify_publication.py
          python src/tests/validate_structure.py
      - name: Browser and PDF dependencies
        run: |
          python -m pip install playwright==1.57.0 pypdf==5.9.0
          python -m playwright install chromium
      - name: Arabic RTL and actual A4
        run: |
          python src/tests/browser_ujairi_3_2_4_aids.py
          python src/tests/browser_azmi_3_2_5_aids.py
      - name: Save screenshots, A4 and verified HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter-324-325-targeted
          path: |
            test-artifacts/
            index.html
            src/philosophy_study_notes.html
            service-worker.js
          retention-days: 7
      - name: Commit only generated output after successful checks
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/philosophy_study_notes.html service-worker.js
          if ! git diff --cached --quiet; then
            git commit -m "Build chapter 3.2.4 and 3.2.5 verified publication [skip ci]"
            git push origin HEAD:refs/heads/editorial/3-2-4-refinement-3-2-5-dedup-20261128
          fi
          python src/build.py --check
